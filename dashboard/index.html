<!doctype html>
<html lang="vi" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="application-name" content="Sổ Thu Chi" />
    <meta
      name="description"
      content="Theo dõi thu nhập và chi tiêu cá nhân, quản lý ngân sách và xem báo cáo theo tháng."
    />
    <title>Sổ Thu Chi – Bảng điều khiển</title>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Sổ Thu Chi" />
    <meta property="og:title" content="Sổ Thu Chi" />
    <meta
      property="og:description"
      content="Theo dõi thu nhập và chi tiêu cá nhân, quản lý ngân sách và xem báo cáo theo tháng."
    />
    <meta property="og:image" content="%DASHBOARD_OG_IMAGE_URL%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo hình cuốn sổ với dấu cộng, dấu trừ và tên Sổ Thu Chi." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="128x128" href="/src/assets/so-thu-chi.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = window.localStorage.getItem("tally.theme");
          if (saved === "light" || saved === "dark") {
            theme = saved;
          }
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute(
            "content",
            theme === "light" ? "#fbfaf8" : "#0a0a0a",
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
